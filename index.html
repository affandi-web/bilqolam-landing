<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Presensi & Jurnal Ngaji - Bilqolam Sabilillah</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Poppins,sans-serif;color:#fff;overflow-x:hidden;
background:#081c15;
}
.hero{
position:relative;min-height:100vh;display:flex;justify-content:center;align-items:center;
background:url('Masjid Sabilillah.jpeg') center/cover no-repeat;
}
.hero::before{
content:"";position:absolute;inset:0;
background:linear-gradient(rgba(5,30,20,.78),rgba(7,20,18,.75));
backdrop-filter:blur(1px);
}
.hero::after{
content:"";position:absolute;inset:-5%;
background:url('Masjid Sabilillah.jpeg') center/cover no-repeat;
opacity:.18;
animation:kenburns 30s ease-in-out infinite alternate;
z-index:0;
}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.08)}}
.pattern{
position:absolute;inset:0;opacity:.08;
background-image:radial-gradient(circle at 20px 20px,#d4af37 2px,transparent 2px);
background-size:60px 60px;
}
.card{
position:relative;z-index:2;
width:min(92%,900px);
padding:48px;border-radius:28px;
background:rgba(255,255,255,.10);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.18);
box-shadow:0 20px 60px rgba(0,0,0,.35);
text-align:center;
animation:up 1s ease;
}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.logo{
width:110px;height:110px;border-radius:50%;margin:0 auto 20px;
display:grid;place-items:center;font-size:54px;
background:radial-gradient(circle,#d4af37,#0f4c3a);
box-shadow:0 0 35px rgba(212,175,55,.45);
animation:float 4s ease-in-out infinite;
}
@keyframes float{50%{transform:translateY(-10px)}}
h1{font-family:Cinzel,serif;font-size:42px}
h2{font-weight:300;color:#f5f5f5;margin:10px 0 25px}
.quote{margin:10px auto 20px;max-width:700px}
.arabic{font-size:28px;color:#ffd86b}
.info{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:25px 0}
.info div{background:rgba(255,255,255,.08);padding:12px 20px;border-radius:16px}
.buttons{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;margin-top:25px}
.btn{
position:relative;overflow:hidden;
padding:18px 36px;border-radius:50px;
text-decoration:none;color:#fff;font-weight:700;
min-width:260px;
transition:.3s;
box-shadow:0 12px 25px rgba(0,0,0,.25);
}
.tahfidz{background:linear-gradient(135deg,#0f8f47,#28c76f)}
.tahsin{background:linear-gradient(135deg,#0f6ab5,#34b3ff)}
.btn:hover{transform:translateY(-6px) scale(1.02)}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.5);animation:ripple .6s linear}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.footer{margin-top:30px;font-size:13px;color:#ddd}
.particle{
position:absolute;border-radius:50%;background:rgba(255,255,255,.25);
animation:rise linear infinite;
}
@keyframes rise{
from{transform:translateY(100vh);opacity:0}
20%{opacity:1}
to{transform:translateY(-20vh);opacity:0}
}
@media(max-width:700px){
.card{padding:30px 20px}
h1{font-size:30px}
.arabic{font-size:22px}
.btn{width:100%}
}
</style>
</head>
<body>
<div class="hero">
<div class="pattern"></div>
<div class="card">
<div class="logo">🕌</div>
<h1>PRESENSI & JURNAL NGAJI</h1>
<h2>Bilqolam Sabilillah</h2>
<div class="quote">
<div class="arabic">خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ</div>
<div>Sebaik-baik kalian adalah orang yang belajar Al-Qur'an dan mengajarkannya.</div>
</div>
<div class="info">
<div>🕒 <span id="clock"></span></div>
<div>📅 <span id="date"></span></div>
<div>🌙 <span id="hijri"></span></div>
</div>
<div class="buttons">
<a class="btn tahfidz" href="https://script.google.com/macros/s/AKfycbx9Wg8DilER7HKPy8k3FONHdzexzOUQ5DpoBZYwXkFRE5-bDaTfyjEzf9I8u-I8qa0y/exec">📖 KELAS TAHFIDZ</a>
<a class="btn tahsin" href="https://script.google.com/macros/s/AKfycbyBPwo5S_ZR7kZszd1-2V1pOa1KioBSdDgG36ZgE1o2i2jlxMILb9ycLBv91reE7cg4/exec">📚 KELAS TAHSIN</a>
</div>
<div class="footer">
<div id="greeting"></div>
<br>© Bilqolam Sabilillah • Membumikan Al-Qur'an dengan Metode Bilqolam
</div>
</div>
</div>
<script>
function tick(){
const n=new Date();
clock.textContent=n.toLocaleTimeString('id-ID')+' WIB';
date.textContent=n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
hijri.textContent=new Intl.DateTimeFormat('id-TN-u-ca-islamic',{day:'numeric',month:'long',year:'numeric'}).format(n)+' H';
let h=n.getHours();
greeting.textContent=h<11?'🌅 Selamat Pagi':h<15?'☀️ Selamat Siang':h<18?'🌤 Selamat Sore':'🌙 Selamat Malam';
}
setInterval(tick,1000);tick();

document.querySelectorAll('.btn').forEach(btn=>{
btn.addEventListener('click',function(e){
const c=document.createElement('span');
const d=Math.max(this.clientWidth,this.clientHeight);
c.className='ripple';c.style.width=c.style.height=d+'px';
const r=this.getBoundingClientRect();
c.style.left=(e.clientX-r.left-d/2)+'px';
c.style.top=(e.clientY-r.top-d/2)+'px';
this.appendChild(c);
setTimeout(()=>c.remove(),600);
});
});
for(let i=0;i<18;i++){
let p=document.createElement('div');
p.className='particle';
let s=Math.random()*5+2;
p.style.width=s+'px';p.style.height=s+'px';
p.style.left=Math.random()*100+'vw';
p.style.animationDuration=(10+Math.random()*12)+'s';
p.style.animationDelay=(-Math.random()*10)+'s';
document.body.appendChild(p);
}
</script>
</body>
</html>
